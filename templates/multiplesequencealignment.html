<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.form/4.3.0/jquery.form.min.js"
        integrity="sha384-qlmct0AOBiA2VPZkMY3+2WqkHtIQ9lSdAsAn5RUJD/3vA5MKDgSGcdmIv4ycVxyn"
        crossorigin="anonymous"></script>
    <script src="{{url_for('static',filename='javascript/upload.js')}}"></script>
    <script>

    </script>
    <style>
        .anyClass {
            height: 150px;
            overflow-y: scroll;
        }
    </style>
</head>

<body>
    <div class="container">
        <br />
        <h3 align="center"> Fasta file upload </h3>
        <br />
        <div class="panel panel-default">
            <div class="panel-heading"><b>Ajax file upload</b></div>
            <div class="panel-body">
                <form id="uploadFastas" action=upload method="POST" enctype="multipart/form-data" class="__add">
                    <div class="form-group">
                        {% set max_file_num = 10 %}
                        <label for="uploadFile">File Upload
                            <button type="button" class="btn btn-secondary"
                                onclick="add_file('{{max_file_num}}');">파일추가</button>
                            <button type="button" class="btn btn-secondary"
                                onclick="del_file('{{max_file_num}}');">파일제거</button>
                        </label>
                        {% for iii in range(1,max_file_num+1): %}
                        <input type="file" name="uploadFile{{iii}}" id="uploadFile{{iii}}" style="display:none;"
                            accept=".fa, .fasta" />
                        {% endfor %}

                    </div>
                    <div class=" form-group">
                        <input type="submit" id="uploadSubmit" value="Upload" class="btn btn-info" />
                    </div>
                    <div class="progress">
                        <div class="progress-bar progress-bar-striped bg-success" role="progressbar" aria-valuenow="0"
                            aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>

    <div class="container">
        <br />
        <h3 align="center"> Redundancy reduction </h3>
        <br />
        <div class="panel panel-default">
            <div class="panel-heading"><b>CD-HIT</b></div>
            <div class="panel-body">
                <div id="uploadResults">
                    <h4>Uploaded files:</h4>
                </div>
                <label>lower bound (>= 0.4)</label>
                <input type="text" id="cd_hit_lb" name="cd_hit_lb" value="0.4"><br>
                <button id="run_cd_hit">run cd-hit</button><br>
                <div id="cd_hit_run_res"></div><br>
            </div>
        </div>
    </div>

    <div class="container">
        <br />
        <h3 align="center"> Multiple Sequence Alignment </h3>
        <br />
        <div class="panel panel-default">
            <div class="panel-heading"><b>Clustal Omega</b></div>
            <div class="panel-body">
                <h4>MSA input:</h4>
                <div id="msa_input"></div>
                <button id="run_msa">run multiple sequence alignment</button>
                <p>
                <div id="msa_res"></div>
                </p>
                <p>
                <div id="hhr_res" margin-left: 1px></div>
                </p>
                <p>
                    <button class="btn btn-primary" type="button" data-toggle="collapse" data-target="#collapseExample"
                        aria-expanded="false" aria-controls="collapseExample">
                        clustal omega running log
                    </button>
                </p>
                <div class="collapse" id="collapseExample">
                    <div class="card text-white bg_dark BORDER-DARD mb-3 overflow-auto">
                        <div class="card card-body ">
                            <div id="clustalo_log"></div>
                        </div>
                    </div>
                </div>
                </p>
            </div>
        </div>
    </div>

    <script>
        var isRun = 0;
        var cd_hit_files;

        // for cd-hit : reduction of redundancy
        $("#run_cd_hit").click(function () {
            if (isRun > 0) {
                // ajax 실행 중에 중복해서 실행 되지 않게 한다.
                alert("cd-hit 실행 중");
                return;
            }
            $.ajax({
                type: 'POST',
                url: '{{url_for("cd_hit")}}',
                data: JSON.stringify({
                    "files": uploaded_files,
                    "lower_bound": $("#cd_hit_lb").val(),
                    "config": '{{config}}'
                }),
                dataType: 'JSON',
                contentType: "application/json",
                success: function (data) {
                    $("#cd_hit_run_res").html(data["res"]);
                    cd_hit_files = data["res"]
                    $("#msa_input").html(cd_hit_files);
                },
                beforeSend: function () {
                    isRun = isRun + 1; // ajax 실행 중에 중복해서 실행 되지 않게 한다.
                },
                complete: function () {
                    isRun = isRun - 1;
                },
                error: function (request, status, error) {
                    alert('cd-hit error:[' + status + '][' + error + ']');
                }
            })
        });

        $("#run_msa").click(function () {
            if (isRun > 0) {
                // ajax 실행 중에 중복해서 실행 되지 않게 한다.
                alert("MSA 실행 중");
                return;
            }
            $.ajax({
                type: 'POST',
                url: '{{url_for("run_msa")}}',
                data: JSON.stringify({
                    "config": '{{config}}',
                    "in_fa": cd_hit_files
                }),
                dataType: 'JSON',
                contentType: "application/json",
                success: function (data) {
                    // jobid = '{{config["jobid"]}}'
                    $("#msa_res").html(
                        "<div class='card card-body'>" +
                        "aln file: " +
                        "<a href=" +
                        '{{url_for("local_download_msa", filename="__FILENAME__")}}'.replace("__JOBID__", data["msa_res"]) +
                        '>' +
                        data['msa_res'] + "</a>" +
                        "</div>");

                    $("#hhr_res").html(
                        "high homology regions" +
                        "<table class=\"table table-striped table-hover w-auto\" > " +
                        data["hhr_res"] +
                        "</table>"
                    );
                },
                beforeSend: function () {
                    isRun = isRun + 1; // ajax 실행 중에 중복해서 실행 되지 않게 한다.
                    read_clustalo_log();
                    interval = setInterval(function () {
                        read_clustalo_log();
                    }, 5000); // 5초 마다 리프레쉬
                },
                complete: function () {
                    isRun = isRun - 1;
                    clearInterval(interval);
                },
                error: function (request, status, error) {
                    alert('ajax error:[' + status + '][' + error + ']');
                }
            })
        })

        var log_outstr;
        function read_clustalo_log() {
            var clustalo_log_fn = cd_hit_files.replace(".fa", ".log");
            console.log(clustalo_log_fn);
            $.ajax({
                type: 'POST',
                url: '{{url_for("read_clustalo_log")}}',
                data: JSON.stringify({
                    "log_fn": clustalo_log_fn,
                }),
                dataType: 'JSON',
                contentType: "application/json",
                success: function (data) {
                    log_outstr = data["res"].replace("");
                    $("#clustalo_log").html(log_outstr.replace(/\n/g, "<br />"));
                },
                beforeSend: function () {
                },
                complete: function () {
                },
                error: function (request, status, error) {
                    console.log(error);
                    alert('ajax error: read_clustalo_log [' + status + '][' + error + ']');
                }
            });
        };
    </script>
</body>

</html>
